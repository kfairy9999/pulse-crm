# Required paid resources: Render's 0.5c-512mb web plan and a 1 GB disk.
# Review https://render.com/pricing before applying this Blueprint.
services:
  - type: web
    name: pulse-crm
    runtime: node
    plan: 0.5c-512mb
    repo: https://github.com/kfairy9999/pulse-crm
    branch: feat/working-mvp
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    disk:
      name: pulse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/pulse.db
      - key: REQUIRE_SECURE_DEPLOYMENT
        value: 'true'
      - key: AUTH_ENABLED
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: APP_ORIGIN
        value: https://pulse-crm.onrender.com
      - key: SESSION_TTL_DAYS
        value: '7'
      - key: SEED_SAMPLE_DATA
        value: 'false'
      - key: SETUP_TOKEN
        generateValue: true
